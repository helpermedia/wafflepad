[package]
name = "wafflepad"
version = "0.1.0"
description = "A macOS Launchpad alternative"
authors = ["you"]
edition = "2021"

[lib]
name = "wafflepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8"
dirs = "6"
rayon = "1.10"
thiserror = "2"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSBundle", "NSURL", "NSArray", "NSUserDefaults", "NSData", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSWindow", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSImage", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSImageRep", "NSMenu", "NSMenuItem", "NSPasteboard", "NSPasteboardItem", "NSView", "NSWorkspace", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGColorSpace", "CGContext", "CGImage"] }

